name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.repository == 'poolifier/poolifier'

    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}

    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

      - name: Dispatch CI for release pull request
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          pull_request=$(jq -r '.number' <<< "$RELEASE_PR")
          head_ref=$(jq -r '.headBranchName' <<< "$RELEASE_PR")
          base_ref=$(jq -r '.baseBranchName' <<< "$RELEASE_PR")

          gh workflow run ci.yml \
            --repo "${{ github.repository }}" \
            --ref "$head_ref" \
            --raw-field pull_request="$pull_request" \
            --raw-field head_ref="$head_ref" \
            --raw-field base_ref="$base_ref"

  build-release:
    needs: release-please
    runs-on: ubuntu-latest
    if: needs.release-please.outputs.release_created

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Tests & Coverage
        run: pnpm test:coverage

      - name: Lint
        run: pnpm lint

      - name: Production Build
        run: pnpm build:prod

  publish-jsr:
    needs: build-release
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x

      - name: Read package.json version
        id: package-version
        uses: jaywcjlove/github-action-package@7b51ba8833a0ec973a38409403525fa29c2ab9ee # main

      - name: Publish Release
        if: ${{ contains(steps.package-version.outputs.version, '-') == false }}
        run: npx jsr publish --allow-dirty

  publish-npm:
    needs: build-release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Read package.json version
        id: package-version
        uses: jaywcjlove/github-action-package@7b51ba8833a0ec973a38409403525fa29c2ab9ee # main

      - name: Publish Release
        if: ${{ contains(steps.package-version.outputs.version, '-') == false }}
        run: pnpm publish --no-git-checks

      - name: Publish Release Candidate
        if: ${{ contains(steps.package-version.outputs.version, '-rc') == true }}
        run: pnpm publish --no-git-checks --tag next

      - name: Publish Beta Release
        if: ${{ contains(steps.package-version.outputs.version, '-beta') == true }}
        run: pnpm publish --no-git-checks --tag beta

      - name: Publish Alpha Release
        if: ${{ contains(steps.package-version.outputs.version, '-alpha') == true }}
        run: pnpm publish --no-git-checks --tag alpha

  publish-documentation:
    needs: [publish-npm, publish-jsr]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GH_TOKEN_PROTECTED }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          cache: 'pnpm'

      - name: Generate documentation
        run: |
          pnpm install --ignore-scripts --frozen-lockfile
          pnpm typedoc

      - name: Commit files
        if: github.ref == 'refs/heads/${{ github.event.repository.default_branch }}'
        env:
          COMMIT_MESSAGE: 'docs: publish documentation'
          COMMIT_AUTHOR: Documentation Bot
          COMMIT_EMAIL: documentation-bot@users.noreply.github.com
        run: |
          git config --local user.name "${{ env.COMMIT_AUTHOR }}"
          git config --local user.email "${{ env.COMMIT_EMAIL }}"
          git pull
          git add ./docs
          git commit -a -m "${{ env.COMMIT_MESSAGE }}"

      - name: Push changes
        if: github.ref == 'refs/heads/${{ github.event.repository.default_branch }}'
        uses: CasperWA/push-protected@74d25b8aa10e0c29024138735d32f3c0b75f9279 # v2
        with:
          token: ${{ secrets.GH_TOKEN_PROTECTED }}
          branch: ${{ github.event.repository.default_branch }}
