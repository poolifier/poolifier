name: Internal benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  internal-benchmark:
    if: github.repository == 'poolifier/poolifier'
    runs-on:
      group: default
      labels: [self-hosted, internal-benchmark]
    env:
      BENCHER_PROJECT: poolifier
      BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
      BENCHER_ADAPTER: json
      BENCHER_TESTBED: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          check-latest: true
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile
      - uses: bencherdev/bencher@413bcf965d6bbda1592f2197bde016db55348746 # main
      - name: Run production benchmark
        run: pnpm benchmark:tinybench:prod
      - name: Publish benchmark
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            args+=(--dry-run)
          fi
          bencher run \
          "${args[@]}" \
          --branch "$GITHUB_REF_NAME" \
          --threshold-measure latency \
          --threshold-test t_test \
          --threshold-max-sample-size 64 \
          --threshold-lower-boundary _ \
          --threshold-upper-boundary 0.99 \
          --threshold-measure throughput \
          --threshold-test t_test \
          --threshold-max-sample-size 64 \
          --threshold-lower-boundary 0.99 \
          --threshold-upper-boundary _ \
          --thresholds-reset \
          --file benchmark-report.json \
          --err
